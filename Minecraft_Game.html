<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Game - HD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .hud {
            position: absolute;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            font-size: 16px;
            font-family: monospace;
        }

        .hud-top-left {
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            padding: 12px;
            border-radius: 8px;
            line-height: 1.8;
        }

        .hud-top-right {
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            padding: 12px;
            border-radius: 8px;
            text-align: right;
            line-height: 1.8;
        }

        .crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.6);
        }

        .crosshair::before {
            width: 2px;
            height: 8px;
            left: 50%;
            top: -10px;
            transform: translateX(-50%);
        }

        .crosshair::after {
            height: 2px;
            width: 8px;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .hotbar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 10px;
            pointer-events: all;
            z-index: 101;
        }

        .hotbar-item {
            width: 45px;
            height: 45px;
            background: rgba(100,100,100,0.8);
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .hotbar-item.active {
            border-color: #ffff00;
            background: rgba(150,150,150,0.9);
            transform: scale(1.1);
        }

        .hotbar-item:hover {
            transform: scale(1.05);
        }

        .mobile-buttons {
            position: fixed;
            bottom: 100px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: all;
            z-index: 101;
        }

        .btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: all 0.1s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .btn:active {
            transform: scale(0.95);
            background: rgba(0,0,0,0.9);
        }

        .movement-pad {
            position: fixed;
            bottom: 30px;
            left: 15px;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            gap: 5px;
            pointer-events: all;
            z-index: 101;
        }

        .pad-btn {
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.4);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            border-radius: 5px;
            transition: all 0.1s;
        }

        .pad-btn:active {
            background: rgba(100,100,100,0.8);
            transform: scale(0.95);
        }

        .info {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .hud {
                font-size: 14px;
            }

            .hotbar-item {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .pad-btn {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div class="crosshair"></div>

        <div class="hud-top-left hud">
            <div>❤️ Health: <span id="health">20</span>/20</div>
            <div>🍗 Food: <span id="food">20</span>/20</div>
            <div>Mode: <span id="mode">Survival</span></div>
        </div>

        <div class="hud-top-right hud">
            <div>X: <span id="posX">0</span></div>
            <div>Y: <span id="posY">0</span></div>
            <div>Z: <span id="posZ">0</span></div>
            <div id="fps">FPS: 60</div>
        </div>

        <div class="hotbar">
            <div class="hotbar-item active" data-block="grass">🟩</div>
            <div class="hotbar-item" data-block="dirt">🟫</div>
            <div class="hotbar-item" data-block="stone">🪨</div>
            <div class="hotbar-item" data-block="wood">🟦</div>
            <div class="hotbar-item" data-block="sand">🟨</div>
            <div class="hotbar-item" data-block="lava">🔴</div>
            <div class="hotbar-item" data-block="water">💧</div>
            <div class="hotbar-item" data-block="leaves">🌳</div>
        </div>

        <div class="mobile-buttons">
            <button class="btn" id="jumpBtn">⬆️</button>
            <button class="btn" id="breakBtn">✋ Break</button>
            <button class="btn" id="placeBtn">👋 Place</button>
        </div>

        <div class="movement-pad">
            <button class="pad-btn" style="grid-column: 2;">⬆️</button>
            <button class="pad-btn" style="grid-column: 1; grid-row: 2;">⬅️</button>
            <button class="pad-btn" style="grid-column: 2; grid-row: 2;">⬇️</button>
            <button class="pad-btn" style="grid-column: 3; grid-row: 2;">➡️</button>
        </div>

        <div class="info">
            Left Click: Break | Right Click: Place | WASD/Arrows: Move | Space: Jump
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game constants
        const BLOCK_SIZE = 50;
        const VIEW_DISTANCE = 10;
        const GRAVITY = 0.6;
        const MOVE_SPEED = 3;

        // Game state
        let gameState = {
            camera: { x: 50, y: 50, z: 0 },
            player: {
                x: 0,
                y: 50,
                z: 0,
                vx: 0,
                vy: 0,
                vz: 0,
                onGround: false,
                health: 20,
                food: 20,
                selectedBlock: 'grass'
            },
            keys: {},
            blocks: new Map(),
            time: 0,
            dayNight: 'day'
        };

        // Block definitions
        const BLOCKS = {
            grass: { color: '#7cb342', emoji: '🟩', solid: true },
            dirt: { color: '#8b6f47', emoji: '🟫', solid: true },
            stone: { color: '#9e9e9e', emoji: '🪨', solid: true },
            wood: { color: '#6d4c41', emoji: '🟦', solid: true },
            sand: { color: '#fdd835', emoji: '🟨', solid: true },
            water: { color: '#2196f3', emoji: '💧', solid: false },
            lava: { color: '#ff6f00', emoji: '🔴', solid: false },
            leaves: { color: '#558b2f', emoji: '🌳', solid: true },
            cobblestone: { color: '#757575', emoji: '⬜', solid: true },
            bedrock: { color: '#1a1a1a', emoji: '⬛', solid: true }
        };

        // Initialize world
        function initializeWorld() {
            // Create terrain
            for (let x = -30; x <= 30; x++) {
                for (let z = -30; z <= 30; z++) {
                    const height = Math.floor(
                        30 + 
                        8 * Math.sin(x * 0.1) * Math.cos(z * 0.1) +
                        4 * Math.sin(x * 0.05)
                    );

                    for (let y = 0; y <= height; y++) {
                        let blockType = 'stone';
                        if (y === height) blockType = 'grass';
                        else if (y > height - 3) blockType = 'dirt';
                        else if (y === 0) blockType = 'bedrock';

                        const key = `${x},${y},${z}`;
                        gameState.blocks.set(key, blockType);
                    }

                    // Add trees
                    if (Math.random() < 0.08 && height > 25) {
                        for (let i = 0; i < 5; i++) {
                            gameState.blocks.set(`${x},${height + 1 + i},${z}`, 'wood');
                        }
                        for (let dx = -2; dx <= 2; dx++) {
                            for (let dz = -2; dz <= 2; dz++) {
                                if (Math.abs(dx) <= 1 || Math.abs(dz) <= 1) {
                                    for (let i = 3; i < 7; i++) {
                                        gameState.blocks.set(`${x + dx},${height + 1 + i},${z + dz}`, 'leaves');
                                    }
                                }
                            }
                        }
                    }

                    // Add water
                    if (height < 30) {
                        for (let y = height + 1; y <= 30; y++) {
                            const key = `${x},${y},${z}`;
                            if (!gameState.blocks.has(key)) {
                                gameState.blocks.set(key, 'water');
                            }
                        }
                    }
                }
            }
        }

        // Render world (isometric view)
        function render() {
            // Sky gradient
            let skyColor = '#87ceeb';
            if (gameState.dayNight === 'night') {
                skyColor = '#1a1a2e';
            }
            ctx.fillStyle = skyColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw blocks
            const blocksToRender = [];

            gameState.blocks.forEach((blockType, key) => {
                const [x, y, z] = key.split(',').map(Number);
                
                const dx = x - gameState.player.x;
                const dy = y - gameState.player.y;
                const dz = z - gameState.player.z;

                if (Math.abs(dx) < VIEW_DISTANCE && Math.abs(dy) < VIEW_DISTANCE && Math.abs(dz) < VIEW_DISTANCE) {
                    blocksToRender.push({ x, y, z, blockType, distance: dx*dx + dy*dy + dz*dz });
                }
            });

            // Sort by distance (painter's algorithm)
            blocksToRender.sort((a, b) => a.distance - b.distance);

            blocksToRender.forEach(block => {
                drawBlock(block.x, block.y, block.z, block.blockType);
            });

            // Draw player indicator
            drawPlayerMarker();

            // Update HUD
            updateHUD();
        }

        function drawBlock(x, y, z, blockType) {
            const block = BLOCKS[blockType];
            
            // Isometric projection
            const screenX = (canvas.width / 2) + (x - gameState.player.x) * 30 - (z - gameState.player.z) * 30;
            const screenY = (canvas.height / 2) + (y - gameState.player.y) * 20 + (x - gameState.player.x) * 15 + (z - gameState.player.z) * 15;

            // Draw block faces
            const size = 30;

            // Top face
            ctx.fillStyle = block.color;
            ctx.globalAlpha = 1;
            ctx.beginPath();
            ctx.moveTo(screenX, screenY - 20);
            ctx.lineTo(screenX + size / 2, screenY - 20 + 15);
            ctx.lineTo(screenX, screenY - 20 + 30);
            ctx.lineTo(screenX - size / 2, screenY - 20 + 15);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.stroke();

            // Left face (darker)
            ctx.fillStyle = adjustBrightness(block.color, -20);
            ctx.beginPath();
            ctx.moveTo(screenX - size / 2, screenY - 20 + 15);
            ctx.lineTo(screenX, screenY - 20 + 30);
            ctx.lineTo(screenX, screenY + 10);
            ctx.lineTo(screenX - size / 2, screenY - 5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Right face (darker)
            ctx.fillStyle = adjustBrightness(block.color, -10);
            ctx.beginPath();
            ctx.moveTo(screenX, screenY - 20 + 30);
            ctx.lineTo(screenX + size / 2, screenY - 20 + 15);
            ctx.lineTo(screenX + size / 2, screenY - 5);
            ctx.lineTo(screenX, screenY + 10);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.globalAlpha = 1;
        }

        function adjustBrightness(color, percent) {
            const num = parseInt(color.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 +
                (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255))
                .toString(16).slice(1);
        }

        function drawPlayerMarker() {
            const x = canvas.width / 2;
            const y = canvas.height / 2 - 30;

            ctx.fillStyle = 'rgba(255, 100, 100, 0.8)';
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = 'white';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('👨', x, y + 6);
        }

        function updateHUD() {
            document.getElementById('posX').textContent = Math.floor(gameState.player.x);
            document.getElementById('posY').textContent = Math.floor(gameState.player.y);
            document.getElementById('posZ').textContent = Math.floor(gameState.player.z);
            document.getElementById('health').textContent = gameState.player.health;
            document.getElementById('food').textContent = gameState.player.food;
        }

        // Input handling
        window.addEventListener('keydown', (e) => {
            gameState.keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') {
                jump();
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            gameState.keys[e.key.toLowerCase()] = false;
        });

        function jump() {
            if (gameState.player.onGround) {
                gameState.player.vy = -12;
                gameState.player.onGround = false;
            }
        }

        // Mobile buttons
        document.getElementById('jumpBtn').addEventListener('click', jump);

        document.getElementById('breakBtn').addEventListener('click', () => {
            breakBlock();
        });

        document.getElementById('placeBtn').addEventListener('click', () => {
            placeBlock();
        });

        // Hotbar selection
        document.querySelectorAll('.hotbar-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.hotbar-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                gameState.player.selectedBlock = item.dataset.block;
            });
        });

        // Movement pad
        const padButtons = document.querySelectorAll('.pad-btn');
        padButtons[0].addEventListener('mousedown', () => { gameState.keys['arrowup'] = true; });
        padButtons[0].addEventListener('mouseup', () => { gameState.keys['arrowup'] = false; });
        padButtons[0].addEventListener('touchstart', () => { gameState.keys['arrowup'] = true; });
        padButtons[0].addEventListener('touchend', () => { gameState.keys['arrowup'] = false; });

        padButtons[1].addEventListener('mousedown', () => { gameState.keys['arrowleft'] = true; });
        padButtons[1].addEventListener('mouseup', () => { gameState.keys['arrowleft'] = false; });
        padButtons[1].addEventListener('touchstart', () => { gameState.keys['arrowleft'] = true; });
        padButtons[1].addEventListener('touchend', () => { gameState.keys['arrowleft'] = false; });

        padButtons[2].addEventListener('mousedown', () => { gameState.keys['arrowdown'] = true; });
        padButtons[2].addEventListener('mouseup', () => { gameState.keys['arrowdown'] = false; });
        padButtons[2].addEventListener('touchstart', () => { gameState.keys['arrowdown'] = true; });
        padButtons[2].addEventListener('touchend', () => { gameState.keys['arrowdown'] = false; });

        padButtons[3].addEventListener('mousedown', () => { gameState.keys['arrowright'] = true; });
        padButtons[3].addEventListener('mouseup', () => { gameState.keys['arrowright'] = false; });
        padButtons[3].addEventListener('touchstart', () => { gameState.keys['arrowright'] = true; });
        padButtons[3].addEventListener('touchend', () => { gameState.keys['arrowright'] = false; });

        // Block breaking/placing
        function breakBlock() {
            const x = Math.round(gameState.player.x);
            const y = Math.round(gameState.player.y);
            const z = Math.round(gameState.player.z);

            for (let dx = -2; dx <= 2; dx++) {
                for (let dy = -2; dy <= 2; dy++) {
                    for (let dz = -2; dz <= 2; dz++) {
                        const key = `${x + dx},${y + dy},${z + dz}`;
                        if (gameState.blocks.has(key)) {
                            gameState.blocks.delete(key);
                            return;
                        }
                    }
                }
            }
        }

        function placeBlock() {
            const x = Math.round(gameState.player.x + 3);
            const y = Math.round(gameState.player.y);
            const z = Math.round(gameState.player.z);

            const key = `${x},${y},${z}`;
            gameState.blocks.set(key, gameState.player.selectedBlock);
        }

        // Game loop
        let lastFrameTime = Date.now();
        let frameCount = 0;

        function gameLoop() {
            // Handle movement
            if (gameState.keys['w'] || gameState.keys['arrowup']) {
                gameState.player.z -= MOVE_SPEED;
            }
            if (gameState.keys['s'] || gameState.keys['arrowdown']) {
                gameState.player.z += MOVE_SPEED;
            }
            if (gameState.keys['a'] || gameState.keys['arrowleft']) {
                gameState.player.x -= MOVE_SPEED;
            }
            if (gameState.keys['d'] || gameState.keys['arrowright']) {
                gameState.player.x += MOVE_SPEED;
            }

            // Apply gravity
            gameState.player.vy += GRAVITY;
            gameState.player.y += gameState.player.vy;

            // Ground collision
            const blockBelow = gameState.blocks.get(`${Math.round(gameState.player.x)},${Math.round(gameState.player.y + 1)},${Math.round(gameState.player.z)}`);
            if (blockBelow) {
                gameState.player.y = Math.round(gameState.player.y);
                gameState.player.vy = 0;
                gameState.player.onGround = true;
            } else {
                gameState.player.onGround = false;
            }

            // FPS counter
            frameCount++;
            const now = Date.now();
            if (now - lastFrameTime > 1000) {
                document.getElementById('fps').textContent = `FPS: ${frameCount}`;
                frameCount = 0;
                lastFrameTime = now;
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        initializeWorld();
        gameLoop();

        // Prevent default touches
        document.addEventListener('touchmove', (e) => {
            if (e.target.classList.contains('pad-btn') || e.target.classList.contains('btn') || e.target.classList.contains('hotbar-item')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
